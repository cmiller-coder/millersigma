<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Assembly Line Throughput Conveyor — Ford Sigma Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;background:transparent;color:#0A1A3C;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:14px 16px;gap:10px}
  #top{display:flex;justify-content:space-between;align-items:baseline;flex:0 0 auto}
  #ttl{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#00095B}
  #meta{font-size:11px;color:#5B6B85}
  #meta b{color:#00095B;font-size:13px}
  #lanes{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;overflow-y:auto;overflow-x:hidden}
  .lane{position:relative;flex:1;min-height:44px;background:linear-gradient(180deg,#EEF1F8,#E3E8F5);border-radius:8px;overflow:hidden;border:1px solid #D7DEEE}
  .lane .beltmarks{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(0,9,91,0.06) 0 2px, transparent 2px 34px);animation:beltmove 1.4s linear infinite;will-change:background-position}
  .lane.paused .beltmarks{animation-play-state:paused}
  @keyframes beltmove{from{background-position-x:0}to{background-position-x:-34px}}
  .lane-label{position:absolute;left:8px;top:4px;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#00095B;z-index:5;background:rgba(255,255,255,.72);padding:1px 6px;border-radius:4px}
  .lane-util{position:absolute;right:8px;top:4px;font-size:9.5px;font-weight:700;color:#5B6B85;z-index:5;background:rgba(255,255,255,.72);padding:1px 6px;border-radius:4px}
  .track{position:absolute;inset:0;top:16px}
  .veh{position:absolute;top:50%;transform:translateY(-50%);will-change:transform;cursor:default}
  .veh svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
  #tip{position:fixed;pointer-events:none;background:#00095B;border-radius:8px;padding:8px 10px;font-size:11px;color:#fff;opacity:0;transition:opacity .1s;z-index:20;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  #tip b{color:#8FD3FF}
  #legend{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:10px;color:#5B6B85;align-items:center}
  #legend .li{display:flex;align-items:center;gap:5px}
  #legend .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="ttl">Assembly Line Throughput</div>
    <div id="meta"><b id="plantCnt">0</b> plants &middot; <b id="uphTotal">&mdash;</b> units/hr fleet-wide &middot; <b id="utilAvg">&mdash;</b> avg utilization</div>
  </div>
  <div id="lanes"></div>
  <div id="legend">
    <span class="li"><i class="sw" style="background:#00095B"></i>Ford Blue (ICE)</span>
    <span class="li"><i class="sw" style="background:#00B4A6"></i>Ford Model e (EV)</span>
    <span class="li"><i class="sw" style="background:#5B6B85"></i>Ford Pro (Commercial/Fleet)</span>
  </div>
</div>
<div id="tip"></div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var defs=[
    {name:'source',type:'element'},
    {name:'plant',type:'column',source:'source',label:'Plant'},
    {name:'segment',type:'column',source:'source',label:'Segment (ICE / EV / Pro)'},
    {name:'uph',type:'column',source:'source',allowedTypes:['number','integer'],label:'Units per Hour'},
    {name:'utilization',type:'column',source:'source',allowedTypes:['number','integer'],label:'Utilization %'}
  ];
  if(client) client.config.configureEditorPanel(defs);

  var SEG_COLOR={'Ford Blue':'#00095B','ICE':'#00095B','Ford Model e':'#00B4A6','EV':'#00B4A6','Ford Pro':'#5B6B85','Pro':'#5B6B85'};
  function colorFor(seg){
    if(SEG_COLOR[seg]) return SEG_COLOR[seg];
    var s=(seg||'').toLowerCase();
    if(s.indexOf('model e')>=0||s.indexOf('ev')>=0) return '#00B4A6';
    if(s.indexOf('pro')>=0) return '#5B6B85';
    return '#00095B';
  }
  function vehicleSvg(color,scale){
    var w=Math.round(46*scale), h=Math.round(20*scale);
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 46 20" xmlns="http://www.w3.org/2000/svg">'+
      '<rect x="1" y="7" width="34" height="9" rx="2.5" fill="'+color+'"/>'+
      '<path d="M8 7 L14 1.5 H27 L31 7 Z" fill="'+color+'" opacity="0.88"/>'+
      '<rect x="15" y="2.8" width="10.5" height="4.2" rx="1" fill="#FFFFFF" opacity="0.55"/>'+
      '<rect x="33" y="9" width="9" height="5" rx="1.5" fill="'+color+'" opacity="0.7"/>'+
      '<circle cx="10" cy="17" r="3.2" fill="#1A1F29"/><circle cx="10" cy="17" r="1.3" fill="#C7CCD6"/>'+
      '<circle cx="29" cy="17" r="3.2" fill="#1A1F29"/><circle cx="29" cy="17" r="1.3" fill="#C7CCD6"/>'+
      '</svg>';
  }
  var tip=document.getElementById('tip');
  var lanesEl=document.getElementById('lanes');
  var raf=null, laneState=[]; // {trackW, vehicles:[{el,x,speed,w}], loopW}

  function buildLane(p){
    var lane=document.createElement('div'); lane.className='lane';
    var marks=document.createElement('div'); marks.className='beltmarks';
    var label=document.createElement('div'); label.className='lane-label'; label.textContent=p.plant;
    var util=document.createElement('div'); util.className='lane-util'; util.textContent=Math.round(p.utilization)+'% util';
    var track=document.createElement('div'); track.className='track';
    lane.appendChild(marks); lane.appendChild(label); lane.appendChild(util); lane.appendChild(track);
    lanesEl.appendChild(lane);
    return {lane:lane,track:track};
  }

  function render(plants){
    lanesEl.innerHTML=''; laneState=[];
    if(raf){cancelAnimationFrame(raf);raf=null;}
    var totalUph=0, sumUtil=0;
    plants.forEach(function(p){ totalUph+=p.uph; sumUtil+=p.utilization; });
    document.getElementById('plantCnt').textContent=plants.length;
    document.getElementById('uphTotal').textContent=Math.round(totalUph).toLocaleString();
    document.getElementById('utilAvg').textContent=(plants.length?Math.round(sumUtil/plants.length):0)+'%';

    var trackW=lanesEl.clientWidth||600;
    plants.forEach(function(p){
      var parts=buildLane(p);
      var color=colorFor(p.segment);
      // throughput -> number of vehicles visible on the belt at once & their speed
      var n=Math.max(2,Math.min(14,Math.round(p.uph/9)));
      var scale=Math.max(0.55,Math.min(1.25, 0.55+p.utilization/140));
      var vehW=46*scale;
      var speed=0.35+ (p.uph/220); // px per frame baseline, throughput-scaled
      var gap=trackW/n;
      var vehicles=[];
      for(var i=0;i<n;i++){
        var el=document.createElement('div'); el.className='veh';
        el.innerHTML=vehicleSvg(color,scale);
        var x=i*gap;
        el.style.left=x+'px';
        parts.track.appendChild(el);
        (function(el,p,color){
          el.addEventListener('mousemove',function(e){
            tip.innerHTML='<b>'+p.plant+'</b> &middot; '+p.segment+
              '<br>Throughput '+Math.round(p.uph)+' units/hr &middot; Utilization '+Math.round(p.utilization)+'%';
            tip.style.opacity=1; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
          });
          el.addEventListener('mouseleave',function(){tip.style.opacity=0;});
        })(el,p,color);
        vehicles.push({el:el,x:x,w:vehW});
      }
      laneState.push({trackEl:parts.track,vehicles:vehicles,speed:speed,trackW:trackW});
    });

    var last=performance.now();
    function tick(now){
      var dt=Math.min(2,(now-last)/16.67); last=now;
      laneState.forEach(function(ls){
        var w=ls.trackEl.clientWidth||ls.trackW;
        ls.vehicles.forEach(function(v){
          v.x+=ls.speed*dt;
          if(v.x> w+10) v.x=-v.w-2;
          v.el.style.transform='translateY(-50%) translateX('+v.x+'px)';
        });
      });
      raf=requestAnimationFrame(tick);
    }
    raf=requestAnimationFrame(tick);
  }

  function synth(){
    return [
      {plant:'Dearborn Truck (MI)',segment:'Ford Blue',uph:78,utilization:91},
      {plant:'Kansas City AP',segment:'Ford Pro',uph:64,utilization:83},
      {plant:'Rouge EV Center (MI)',segment:'Ford Model e',uph:39,utilization:74},
      {plant:'Cuautitlan (MX)',segment:'Ford Blue',uph:52,utilization:88},
      {plant:'Valencia (ES)',segment:'Ford Pro',uph:45,utilization:79},
      {plant:'Chongqing (CN)',segment:'Ford Model e',uph:31,utilization:67}
    ];
  }

  var st={cfg:{},data:null,unsub:null};
  function recompute(){
    var c=st.cfg||{};
    if(st.data&&c.plant&&st.data[c.plant]){
      var plant=st.data[c.plant]||[], seg=(c.segment&&st.data[c.segment])||[],
          uph=(c.uph&&st.data[c.uph])||[], util=(c.utilization&&st.data[c.utilization])||[];
      var plants=plant.map(function(pl,i){return {
        plant: pl!=null?String(pl):('Plant '+i),
        segment: seg[i]!=null?String(seg[i]):'Ford Blue',
        uph: Number(uph[i])||40,
        utilization: Number(util[i])||70
      };});
      if(plants.length){render(plants);return;}
    }
    render(synth());
  }
  if(client){
    client.config.subscribe(function(cfg){
      st.cfg=cfg||{};
      if(st.unsub){st.unsub();st.unsub=null;}
      if(cfg&&cfg.source){st.unsub=client.elements.subscribeToElementData(cfg.source,function(d){st.data=d;recompute();});}
      recompute();
    });
  } else {
    recompute();
  }

  // ResizeObserver: Sigma sizes the panel after first paint; recompute layout on any size change.
  var ro=new ResizeObserver(function(){ recompute(); });
  ro.observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
