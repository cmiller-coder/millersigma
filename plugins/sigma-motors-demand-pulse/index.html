<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Regional Demand Pulse — Sigma Motors Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;background:transparent;color:#111114;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:6px 10px;gap:8px}
  #grid{flex:1;display:grid;grid-auto-flow:column;gap:10px;place-items:stretch;min-height:0}
  .region{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;gap:6px}
  .region-name{font-size:12px;font-weight:700;color:#111114;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ring-wrap{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
  .ring-glow{position:absolute;left:50%;top:50%;border-radius:50%;background:radial-gradient(circle, rgba(26,112,241,.4), rgba(26,112,241,0) 72%);
    transform:translate(-50%,-50%);animation:glowPulse 1.7s ease-out infinite;pointer-events:none;}
  @keyframes glowPulse{
    0%{opacity:.9;transform:translate(-50%,-50%) scale(.82);}
    70%{opacity:0;transform:translate(-50%,-50%) scale(1.4);}
    100%{opacity:0;transform:translate(-50%,-50%) scale(1.4);}
  }
  .ring-pct{font-weight:800;fill:#111114;}
  .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;}
  #legend{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:16px;font-size:11px;color:#5F5F66}
  #legend .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;}
</style>
</head>
<body>
<div id="wrap">
  <div id="grid"></div>
  <div id="legend">
    <span><i class="dot" style="background:#1A70F1"></i>EV share of backlog</span>
    <span><i class="dot" style="background:#8A8F9C"></i>Hybrid share</span>
    <span>Glow = backlog growing &gt;25%/mo</span>
  </div>
</div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var defs=[
    {name:'source',type:'element'},
    {name:'region',type:'column',source:'source',label:'Region'},
    {name:'ev_backlog',type:'column',source:'source',allowedTypes:['number','integer'],label:'EV Backlog (units)'},
    {name:'hybrid_backlog',type:'column',source:'source',allowedTypes:['number','integer'],label:'Hybrid Backlog (units)'},
    {name:'growth_pct',type:'column',source:'source',allowedTypes:['number','integer'],label:'EV Backlog Growth % (30d)'},
    {name:'backlog_weeks',type:'column',source:'source',allowedTypes:['number','integer'],label:'Backlog (weeks)'}
  ];
  if(client) client.config.configureEditorPanel(defs);

  function sizeFor(total, maxTotal, minD, maxD){
    var frac = Math.sqrt(Math.max(0, Math.min(1, total/maxTotal)));
    return minD + frac*(maxD-minD);
  }

  function badgeLevel(weeks){
    if(weeks>=4) return {bg:'#FCEBEB', fg:'#D14343'};
    if(weeks>=2) return {bg:'#FFF3E2', fg:'#C77A0A'};
    return {bg:'#EAF7EE', fg:'#1F9D55'};
  }

  // Single split-ring per region: a donut split proportionally EV/Hybrid,
  // with the EV share % centered, and a soft pulsing halo on fast growth.
  function ringSVG(size, evPct, glowing){
    var r = 15.5, c = 2*Math.PI*r;
    var evLen = c*(evPct/100), gap = c-evLen;
    var glow = glowing ? '<div class="ring-glow" style="width:'+(size*1.35)+'px;height:'+(size*1.35)+'px;"></div>' : '';
    // NOTE: font-size here is in viewBox units (0-36 space), NOT output px --
    // the svg's viewBox scaling stretches it to the real `size` automatically.
    // A previous version computed this from the outer pixel `size`, which the
    // viewBox then re-scaled a SECOND time, blowing the glyphs up ~3-4x past
    // the ring's own boundary. Fixed value here; visual size still scales
    // correctly with the ring because the whole SVG scales as one unit.
    var fontSize = 11;
    return '<div style="position:relative;width:'+size+'px;height:'+size+'px;">'+glow+
      '<svg width="'+size+'" height="'+size+'" viewBox="0 0 36 36" style="position:relative;z-index:1;">'+
      '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#8A8F9C" stroke-width="4.2"/>'+
      '<circle cx="18" cy="18" r="'+r+'" fill="none" stroke="#1A70F1" stroke-width="4.2" '+
        'stroke-dasharray="'+evLen+' '+gap+'" stroke-dashoffset="'+(c*0.25)+'" stroke-linecap="round" transform="scale(-1,1) translate(-36,0)"/>'+
      '<text x="18" y="18" text-anchor="middle" dominant-baseline="central" class="ring-pct" '+
        'style="font-size:'+fontSize+'px;">'+Math.round(evPct)+'%</text>'+
      '</svg></div>';
  }

  function draw(regions){
    // Row order delivered via subscribeToElementData doesn't reliably follow
    // the source query's ORDER BY -- sort here so the ranking is correct
    // regardless of what order Sigma hands back.
    regions = regions.slice().sort(function(a,b){
      return (b.ev_backlog+b.hybrid_backlog) - (a.ev_backlog+a.hybrid_backlog);
    });
    var grid=document.getElementById('grid');
    grid.style.gridTemplateColumns='repeat('+(regions.length||1)+',1fr)';
    grid.innerHTML='';
    var maxTotal=Math.max.apply(null,regions.map(function(r){return r.ev_backlog+r.hybrid_backlog;}).concat([1]));

    regions.forEach(function(r){
      var total = r.ev_backlog + r.hybrid_backlog;
      var evPct = total>0 ? (r.ev_backlog/total*100) : 0;
      var size = sizeFor(total, maxTotal*1.15, 64, 128);
      var lvl=badgeLevel(r.backlog_weeks);
      var wrap=document.createElement('div'); wrap.className='region';
      wrap.innerHTML =
        '<div class="region-name">'+r.region+'</div>'+
        '<div class="ring-wrap">'+ringSVG(size, evPct, r.growth_pct>25)+'</div>'+
        '<span class="badge" style="background:'+lvl.bg+';color:'+lvl.fg+';">'+r.backlog_weeks.toFixed(1)+' wks</span>';
      grid.appendChild(wrap);
    });
  }

  function synth(){
    return [
      {region:'West', ev_backlog:1135, hybrid_backlog:110, growth_pct:42, backlog_weeks:6.2},
      {region:'Southwest', ev_backlog:1373, hybrid_backlog:73, growth_pct:51, backlog_weeks:5.1},
      {region:'Midwest', ev_backlog:657, hybrid_backlog:122, growth_pct:18, backlog_weeks:2.4},
      {region:'South', ev_backlog:418, hybrid_backlog:146, growth_pct:6, backlog_weeks:1.1},
      {region:'Northeast', ev_backlog:537, hybrid_backlog:159, growth_pct:9, backlog_weeks:1.6}
    ];
  }

  var st={cfg:{},data:null,unsub:null};
  function recompute(){
    var c=st.cfg||{};
    if(st.data && c.region && st.data[c.region]){
      var region=st.data[c.region]||[],
          ev=(c.ev_backlog&&st.data[c.ev_backlog])||[],
          hy=(c.hybrid_backlog&&st.data[c.hybrid_backlog])||[],
          growth=(c.growth_pct&&st.data[c.growth_pct])||[],
          weeks=(c.backlog_weeks&&st.data[c.backlog_weeks])||[];
      var out=region.map(function(name,i){return {
        region:String(name),
        ev_backlog:Number(ev[i])||0,
        hybrid_backlog:Number(hy[i])||0,
        growth_pct:Number(growth[i])||0,
        backlog_weeks:Number(weeks[i])||0
      };});
      if(out.length){ draw(out); return; }
    }
    draw(synth());
  }
  if(client){
    client.config.subscribe(function(cfg){
      st.cfg=cfg||{};
      if(st.unsub){st.unsub();st.unsub=null;}
      if(cfg&&cfg.source){st.unsub=client.elements.subscribeToElementData(cfg.source,function(d){st.data=d;recompute();});}
      recompute();
    });
  }else{ recompute(); }

  // Sigma sizes the panel AFTER first paint -- redraw on any container resize.
  var ro=new ResizeObserver(function(){ recompute(); });
  ro.observe(document.getElementById('wrap'));
})();
</script>
</body>
</html>
