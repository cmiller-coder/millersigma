<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Forecast Bridge — Sigma Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;background:transparent;color:#14181F;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:12px 16px}
  #top{display:flex;justify-content:space-between;align-items:baseline}
  #ttl{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#14181F}
  #sub{font-size:12px;color:#5B6472}#sub b{color:#14181F}
  #stage{flex:1;position:relative;min-height:0}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .barrect{transition:transform .15s;cursor:default;transform-box:fill-box;transform-origin:bottom}
  .grow{animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .conn{stroke:#B6BEC9;stroke-width:1.2;stroke-dasharray:3 3;opacity:0;animation:fade .4s ease forwards}
  @keyframes fade{to{opacity:1}}
  .val{font-size:11px;font-weight:700}.axlab{font-size:11px;fill:#5B6472}.grid{stroke:#E7EBF0;stroke-width:1}
  #tip{position:fixed;pointer-events:none;background:#0F0B12;border:1px solid #ED1C24;border-radius:8px;padding:8px 10px;font-size:11px;color:#F4E9E9;opacity:0;transition:opacity .1s;z-index:10;white-space:nowrap}
  #tip b{color:#ED1C24}
</style>
</head>
<body>
<div id="wrap">
  <div id="top"><div id="ttl">◤ Forecast Bridge</div><div id="sub">baseline <b id="b0">—</b> → forecast <b id="b1">—</b> · net <b id="net">—</b></div></div>
  <div id="stage"><svg id="svg" preserveAspectRatio="none"></svg></div>
</div>
<div id="tip"></div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var defs=[
    {name:'source',type:'element'},
    {name:'label',type:'column',source:'source',label:'Segment / driver'},
    {name:'baseline',type:'column',source:'source',allowedTypes:['number','integer'],label:'Baseline'},
    {name:'forecast',type:'column',source:'source',allowedTypes:['number','integer'],label:'Forecast'}
  ];
  if(client) client.config.configureEditorPanel(defs);
  var SVG='http://www.w3.org/2000/svg', tip=document.getElementById('tip');
  function el(n,at){var e=document.createElementNS(SVG,n);for(var k in at)e.setAttribute(k,at[k]);return e;}
  function fmt(v){v=+v||0;var s=v<0?'-':'',a=Math.abs(v);if(a>=1e9)return s+'$'+(a/1e9).toFixed(2)+'B';if(a>=1e6)return s+'$'+(a/1e6).toFixed(0)+'M';if(a>=1e3)return s+'$'+(a/1e3).toFixed(0)+'K';return s+'$'+a.toFixed(0);}
  function sfmt(v){return (v>=0?'+':'−')+fmt(Math.abs(v));}

  function render(rows){
    var svg=document.getElementById('svg'); svg.innerHTML='';
    var W=svg.clientWidth||760, H=svg.clientHeight||300; svg.setAttribute('viewBox','0 0 '+W+' '+H);
    var B=rows.reduce(function(s,r){return s+r.baseline;},0), F=rows.reduce(function(s,r){return s+r.forecast;},0);
    // build waterfall steps
    var steps=[{name:'Baseline',type:'base',from:0,to:B,val:B}], run=B;
    rows.forEach(function(r){var d=r.forecast-r.baseline; steps.push({name:r.label,type:'delta',from:run,to:run+d,val:d}); run+=d;});
    steps.push({name:'Forecast',type:'fore',from:0,to:F,val:F});
    var padL=8,padR=8,padT=18,padB=42, gw=(W-padL-padR)/steps.length, bw=Math.min(gw*0.62,90);
    var maxV=Math.max(B,F,run)*1.12||1;
    function Y(v){return padT+(1-v/maxV)*(H-padT-padB);}
    // gridlines
    for(var t=0;t<=4;t++){var gy=padT+(t/4)*(H-padT-padB), gv=maxV*(1-t/4);
      svg.appendChild(el('line',{x1:padL,y1:gy,x2:W-padR,y2:gy,class:'grid'}));
      var gl=el('text',{x:padL,y:gy-3,class:'axlab'}); gl.textContent=fmt(gv); svg.appendChild(gl);}
    steps.forEach(function(s,i){
      var cx=padL+gw*i+gw/2, x=cx-bw/2;
      var yTop=Y(Math.max(s.from,s.to)), yBot=Y(Math.min(s.from,s.to)), h=Math.max(2,yBot-yTop);
      var col=s.type==='base'?'#94A3B8':s.type==='fore'?'#ED1C24':(s.val>=0?'#059669':'#DC2626');
      var rect=el('rect',{x:x,y:yTop,width:bw,height:h,rx:3,fill:col,class:'barrect grow'});
      rect.style.animationDelay=(i*0.09)+'s';
      rect.addEventListener('mousemove',function(e){tip.innerHTML='<b>'+s.name+'</b><br>'+(s.type==='delta'?('Δ '+sfmt(s.val)):fmt(s.val));tip.style.opacity=1;tip.style.left=(e.clientX+12)+'px';tip.style.top=(e.clientY+12)+'px';});
      rect.addEventListener('mouseleave',function(){tip.style.opacity=0;});
      svg.appendChild(rect);
      // connector to next
      if(i<steps.length-1){var ny=Y(s.to); var ln=el('line',{x1:x+bw,y1:ny,x2:cx+gw-bw/2,y2:ny,class:'conn'}); ln.style.animationDelay=(i*0.09+0.5)+'s'; svg.appendChild(ln);}
      // value label
      var vl=el('text',{x:cx,y:yTop-5,'text-anchor':'middle',class:'val',fill:col}); vl.textContent=s.type==='delta'?sfmt(s.val):fmt(s.val); svg.appendChild(vl);
      // x label
      var xl=el('text',{x:cx,y:H-padB+16,'text-anchor':'middle',class:'axlab'}); xl.textContent=s.name.length>12?s.name.slice(0,11)+'…':s.name; svg.appendChild(xl);
    });
    document.getElementById('b0').textContent=fmt(B);
    document.getElementById('b1').textContent=fmt(F);
    var net=document.getElementById('net'); net.textContent=sfmt(F-B); net.style.color=(F-B)>=0?'#059669':'#DC2626';
  }
  function synth(){return [['Data Center',9500,11200],['Client',4400,4100],['Gaming',2400,2600],['Embedded',1900,2300]].map(function(r){return {label:r[0],baseline:r[1]*1e6,forecast:r[2]*1e6};});}
  var st={cfg:{},data:null,unsub:null,rt:null};
  function recompute(){var c=st.cfg||{};
    if(st.data&&c.baseline&&c.forecast&&st.data[c.baseline]){
      var b=st.data[c.baseline]||[],f=st.data[c.forecast]||[],l=(c.label&&st.data[c.label])||[];
      var rows=b.map(function(v,i){return {label:l[i]!=null?String(l[i]):('Seg '+i),baseline:Number(v)||0,forecast:Number(f[i])||0};}).filter(function(r){return r.baseline||r.forecast;});
      if(rows.length){render(rows);return;}
    }
    render(synth());
  }
  window.addEventListener('resize',function(){clearTimeout(st.rt);st.rt=setTimeout(recompute,120);});
  if(client){client.config.subscribe(function(cfg){st.cfg=cfg||{};
    if(st.unsub){st.unsub();st.unsub=null;}
    if(cfg&&cfg.source){st.unsub=client.elements.subscribeToElementData(cfg.source,function(d){st.data=d;recompute();});}
    recompute();});
  }else{recompute();}
})();
</script>
</body>
</html>
