  function money(v){
    var a=Math.abs(v);
    if(a>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
    if(a>=1e6) return '$'+(v/1e6).toFixed(1)+'M';

  }
  function pct(v){ return (v*100).toFixed(1)+'%'; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function colorFor(gap){
    // gap is in margin points (e.g. -0.06). Clamp to +/- 8 points.
    var t = Math.max(0, Math.min(1, (gap + 0.08) / 0.16));
    var s = t*(RAMP.length-1), i = Math.min(RAMP.length-2, Math.floor(s)), f = s-i;
    var c = [0,1,2].map(function(k){ return Math.round(lerp(RAMP[i][k], RAMP[i+1][k], f)); });
    return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
  }

  /* ---- squarified treemap (Bruls, Huizing, van Wijk) ---------------------
     Proper squarify, not slice-and-dice: tiles stay close to square so the
     areas are actually comparable by eye, which is the whole point of using a
     treemap instead of the ranked bar chart Sigma can already draw. */
  function squarify(items, x, y, w, h){
    var out = [];
    items = items.slice().sort(function(a,b){ return b.value - a.value; });
    var total = items.reduce(function(s,i){ return s+i.value; }, 0);
    if (total <= 0 || w <= 0 || h <= 0) return out;
    var scale = (w*h)/total;
    var idx = 0;
    while (idx < items.length){
      var short = Math.min(w,h);
      var row = [], rowSum = 0, best = Infinity;
      // grow the row while the worst aspect ratio keeps improving
      for (var j = idx; j < items.length; j++){
        var trySum = rowSum + items[j].value*scale;
        var len = trySum/short;
        var worst = 0;
        for (var k = idx; k <= j; k++){
          var side = (items[k].value*scale)/len;
          worst = Math.max(worst, Math.max(len/side, side/len));
        }
        if (worst > best && row.length) break;
        row.push(items[j]); rowSum = trySum; best = worst;
      }
      var len2 = rowSum/short;
      var off = 0;
      for (var m = 0; m < row.length; m++){
        var side2 = (row[m].value*scale)/len2;
        if (w >= h) out.push({item:row[m], x:x, y:y+off, w:len2, h:side2});
        else        out.push({item:row[m], x:x+off, y:y, w:side2, h:len2});
        off += side2;
      }
      if (w >= h){ x += len2; w -= len2; } else { y += len2; h -= len2; }
      idx += row.length;
    }
    return out;
  }

  function draw(rows, live){

    rows.forEach(function(r){ (byHood[r.n] = byHood[r.n] || []).push(r); });

      inner.forEach(function(t){

        if (r.g < -0.05) below++;

        rect.addEventListener('mousemove', function(ev){

          tip.style.top=(ev.clientY+12)+'px';
        });

      });

      // neighbourhood frame + label on top
      el('rect',{x:c.x,y:c.y,width:Math.max(0,c.w),height:Math.max(0,c.h),
                 fill:'none',stroke:'#ffffff','stroke-width':2.5});
      if (labelH && c.w > 64){
        el('text',{x:c.x+6,y:c.y+11,style:'font-size:10px;font-weight:600;fill:'+INK},
           c.item.key);
        if (c.w > 150) {
          el('text',{x:c.x+c.w-6,y:c.y+11,'text-anchor':'end',
                     style:'font-size:9px;fill:'+MUTED}, money(c.item.value));
        }
      }
    });

    document.getElementById('mode').textContent = live ? '· live' : '· Q2 2026 snapshot';
    document.getElementById('foot').textContent =
      rows.length+' properties · '+cells.length+' neighbourhoods · '
      + below + ' more than 5 points below their own cohort'
      + (live ? '' : ' · static quarter-close snapshot, does not react to page filters');
  }

  var st = {cfg:{}, data:null, unsub:null};
  window.__dbg = st;

  function recompute(){
    var c = st.cfg || {};
    if (st.data && c.property && c.equity && st.data[c.property] && st.data[c.equity]){
      var P=st.data[c.property], N=(c.neighborhood&&st.data[c.neighborhood])||[],
          E=st.data[c.equity], G=(c.gap&&st.data[c.gap])||[], M=(c.margin&&st.data[c.margin])||[];
      var rows=[];
      for (var i=0;i<P.length;i++){
        if (P[i]==null) continue;
        rows.push({p:String(P[i]), n:N[i]!=null?String(N[i]):'Unassigned',
                   e:Math.max(Number(E[i])||0,0), g:Number(G[i])||0, m:Number(M[i])||0});
      }
      rows = rows.filter(function(r){ return r.e > 0; });
      if (rows.length){ draw(rows, true); return; }
    }
    draw(synth(), false);
  }

  if (client){
    client.config.subscribe(function(cfg){
      st.cfg = cfg || {};
      if (st.unsub){ st.unsub(); st.unsub=null; }
      if (cfg && cfg.source){
        st.unsub = client.elements.subscribeToElementData(cfg.source, function(d){
          st.data = d; recompute();
        });
      }
      recompute();
    });
  } else {
    recompute();
  }

  if (window.ResizeObserver){
    new ResizeObserver(function(){ recompute(); }).observe(document.getElementById('stage'));
  }
})();
</script>
</body>
</html>
