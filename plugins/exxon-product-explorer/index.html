<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ExxonMobil Product Explorer — Sigma Plugin</title>
<script src="https://unpkg.com/@sigmacomputing/plugin"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,Inter,Segoe UI,Roboto,Arial,sans-serif;
       background:radial-gradient(120% 120% at 50% 0%,#0a1830 0%,#08101f 55%,#04070d 100%);color:#e9eef6;overflow:hidden}
  #wrap{height:100%;width:100%;display:flex;flex-direction:column;padding:12px 16px}
  #top{display:flex;justify-content:space-between;align-items:baseline;z-index:3}
  #ttl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#fff}
  #ttl b{color:#E4002B}
  #sub{font-size:11px;color:#b98f92}
  #sub b{color:#fff;font-size:14px}
  #stage{flex:1;position:relative;min-height:0}
  svg{position:absolute;inset:0;width:100%;height:100%}
  .chip{cursor:pointer}
  .chip .top{transition:filter .15s}
  .glow{transform-origin:center;transform-box:fill-box}
  #tip{position:fixed;pointer-events:none;background:rgba(12,6,7,.96);border:1px solid #E4002B;border-radius:9px;
       padding:9px 11px;font-size:11px;color:#f4e9e9;opacity:0;transition:opacity .12s;z-index:20;white-space:nowrap;
       box-shadow:0 10px 30px rgba(237,28,36,.25)}
  #tip b{color:#E4002B}#tip .big{font-size:14px;color:#fff;font-weight:700}
  #legend{display:flex;align-items:center;gap:8px;font-size:10px;color:#b98f92;z-index:3}
  #bar{height:7px;flex:1;max-width:220px;border-radius:4px;background:linear-gradient(90deg,#3a1416,#8f1a1f,#E4002B,#ff8a3c)}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes pulse{0%,100%{opacity:.30}50%{opacity:.95}}
  @keyframes flow{to{stroke-dashoffset:-40}}
  .sweep{mix-blend-mode:screen;opacity:.0;animation:sweep 5.5s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-70%);opacity:0}12%{opacity:.6}30%{opacity:0}100%{transform:translateX(120%);opacity:0}}
  .trace{stroke:#E4002B;stroke-width:1;fill:none;opacity:.28;stroke-dasharray:5 7;animation:flow 1.6s linear infinite}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="ttl"><b>◤</b> ExxonMobil Product Explorer</div>
    <div id="sub"><span id="cnt">0</span> products · portfolio rev <b id="tot">—</b> · avg margin <b id="mg">—</b><span id="focus"></span></div>
  </div>
  <div id="stage"><svg id="svg" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="legend"><span>lower margin</span><div id="bar"></div><span>higher margin</span>
    <span style="margin-left:10px">height = revenue · glow/pulse = margin</span></div>
</div>
<div id="tip"></div>
<script>
(function(){
  var client=(window.sigmaComputing&&window.sigmaComputing.plugin&&window.sigmaComputing.plugin.client)||null;
  var defs=[
    {name:'source',type:'element'},
    {name:'label',type:'column',source:'source',label:'Chiplet / Product'},
    {name:'value',type:'column',source:'source',allowedTypes:['number','integer'],label:'Revenue (height)'},
    {name:'glow',type:'column',source:'source',allowedTypes:['number','integer'],label:'Margin % (glow)'},
    {name:'group',type:'column',source:'source',label:'Segment (color)'},
    {name:'filterVar',type:'variable',label:'Click cross-filter → control'}
  ];
  if(client) client.config.configureEditorPanel(defs);
  var selected=null; // segment currently spotlighted
  function setFilter(seg){
    if(!client||!st.cfg||!st.cfg.filterVar) return;
    try{ if(seg==null) client.config.setVariable('filterVar'); else client.config.setVariable('filterVar', seg); }catch(e){}
  }
  var SVG='http://www.w3.org/2000/svg';
  var tip=document.getElementById('tip');
  // segment base hues (AMD red family + accents)
  var HUES={'Upstream':[59,130,246],'Energy Products':[228,0,43],'Chemical Products':[35,180,170],'Specialty Products':[245,158,11]};
  function hue(seg,i){return HUES[seg]||[[237,28,36],[255,122,60],[214,40,120],[35,180,170]][i%4];}
  function rgb(a,m){m=m==null?1:m;return 'rgb('+Math.round(a[0]*m)+','+Math.round(a[1]*m)+','+Math.round(a[2]*m)+')';}
  function el(n,at){var e=document.createElementNS(SVG,n);for(var k in at)e.setAttribute(k,at[k]);return e;}

  function render(chips){
    var svg=document.getElementById('svg'); svg.innerHTML='';
    var W=svg.clientWidth||760, H=svg.clientHeight||360; svg.setAttribute('viewBox','0 0 '+W+' '+H);
    var n=chips.length||1, cols=Math.max(1,Math.ceil(Math.sqrt(n))), rows=Math.ceil(n/cols);
    // isometric tile size to fit
    var hw=Math.min(W/(cols+rows)*0.92, 74), hh=hw*0.52;
    var maxV=Math.max.apply(null,chips.map(function(c){return c.value;}).concat([1]));
    var maxH=Math.min(hw*2.2,120);
    var ox=W/2, oy=H*0.30;
    // defs: emissive gradient + blur
    var defsEl=el('defs',{});
    defsEl.innerHTML='<filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>'+
      '<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>';
    svg.appendChild(defsEl);
    // interposer base plate (big diamond)
    var pad=1.4;
    function iso(gx,gy){return [ox+(gx-gy)*hw, oy+(gx+gy)*hh];}
    var c00=iso(-pad,-pad),c10=iso(cols-1+pad,-pad),c11=iso(cols-1+pad,rows-1+pad),c01=iso(-pad,rows-1+pad);
    svg.appendChild(el('polygon',{points:[c00,c10,c11,c01].map(function(p){return p.join(',');}).join(' '),
      fill:'#140c0d',stroke:'#3a1c1e','stroke-width':1.5}));
    // flowing interconnect traces along the grid
    for(var gi=0;gi<cols;gi++){var a=iso(gi,-pad),b=iso(gi,rows-1+pad);
      svg.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],class:'trace',style:'animation-delay:'+(gi*0.12)+'s'}));}
    for(var gj=0;gj<rows;gj++){var a2=iso(-pad,gj),b2=iso(cols-1+pad,gj);
      svg.appendChild(el('line',{x1:a2[0],y1:a2[1],x2:b2[0],y2:b2[1],class:'trace',style:'animation-delay:'+(gj*0.12)+'s'}));}

    // draw chiplets back-to-front
    chips.forEach(function(c,i){c.gx=i%cols;c.gy=Math.floor(i/cols);});
    chips.slice().sort(function(a,b){return (a.gx+a.gy)-(b.gx+b.gy);}).forEach(function(c){
      var p=iso(c.gx,c.gy), cx=p[0], cy=p[1];
      var ex=Math.max(10,(c.value/maxV)*maxH); // extrude height by revenue
      var base=hue(c.group,c.gx+c.gy), gt=Math.max(0,Math.min(1,c.glow)); // 0..1 margin
      var top=rgb(base,0.7+gt*0.6), left=rgb(base,0.34), right=rgb(base,0.20);
      var g=el('g',{class:'chip'});
      g.style.animation='bob 3.2s ease-in-out infinite'; g.style.animationDelay=((c.gx+c.gy)*0.18)+'s';
      var dim=(selected!=null && c.group!==selected);
      g.style.opacity=dim?0.28:1; g.style.transition='opacity .25s';
      // faces
      var N=[cx,cy-hh],E=[cx+hw,cy],S=[cx,cy+hh],Wp=[cx-hw,cy];
      var Nt=[cx,cy-hh-ex],Et=[cx+hw,cy-ex],St=[cx,cy+hh-ex],Wt=[cx-hw,cy-ex];
      function poly(pts,f,extra){var o={points:pts.map(function(q){return q.join(',');}).join(' '),fill:f};for(var k in (extra||{}))o[k]=extra[k];g.appendChild(el('polygon',o));}
      // emissive glow blob under the top, pulses by margin
      var glowC=el('ellipse',{cx:cx,cy:cy-ex,rx:hw*0.9,ry:hh*0.9,fill:rgb(base,1),filter:'url(#soft)',class:'glow'});
      glowC.style.animation='pulse '+(2.6-gt*1.4).toFixed(2)+'s ease-in-out infinite';
      g.appendChild(glowC);
      poly([Wp,S,St,Wt],left);            // left face
      poly([E,S,St,Et],right);            // right face
      poly([Nt,Et,St,Wt],top,{class:'top',stroke:rgb(base,1),'stroke-width':0.75}); // top face
      poly([Nt,Et,St,Wt],'url(#shine)');  // shine overlay on top
      // interaction
      g.addEventListener('mousemove',function(e){
        tip.innerHTML='<div class="big">'+c.label+'</div><b>'+(c.group||'')+'</b><br>Revenue '+fmt(c.value)+'<br>Margin '+(c.glow*100).toFixed(0)+'%';
        tip.style.opacity=1;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
        g.querySelector('.top').style.filter='brightness(1.5)';});
      g.addEventListener('mouseleave',function(){tip.style.opacity=0;g.querySelector('.top').style.filter='';});
      g.addEventListener('click',function(e){e.stopPropagation();
        selected=(selected===c.group)?null:c.group; setFilter(selected); recompute();});
      svg.appendChild(g);
    });
    svg.addEventListener('click',function(){ if(selected!=null){selected=null;setFilter(null);recompute();} });
    // power-sweep shimmer across the whole package
    var sweep=el('g',{class:'sweep'});
    sweep.appendChild(el('polygon',{points:[[-W*0.18,0],[W*0.02,0],[-W*0.14,H],[-W*0.34,H]].map(function(p){return p.join(',');}).join(' '),
      fill:'url(#shine)'}));
    svg.appendChild(sweep);
    // stats
    var tot=chips.reduce(function(s,c){return s+c.value;},0), avg=chips.reduce(function(s,c){return s+c.glow;},0)/n;
    document.getElementById('cnt').textContent=n;
    document.getElementById('tot').textContent=fmt(tot);
    document.getElementById('mg').textContent=(avg*100).toFixed(0)+'%';
    var f=document.getElementById('focus'); if(f) f.innerHTML=selected?(' · focus <b>'+selected+'</b> ✕'):' · click a product to focus';
  }
  function fmt(v){v=+v||0;var a=Math.abs(v);if(a>=1e9)return '$'+(v/1e9).toFixed(1)+'B';if(a>=1e6)return '$'+(v/1e6).toFixed(0)+'M';if(a>=1e3)return '$'+(v/1e3).toFixed(0)+'K';return '$'+v.toFixed(0);}

  function synth(){
    var d=[['Crude Oil',82000,0.34,'Upstream'],['Natural Gas',41000,0.31,'Upstream'],
    ['LNG',28000,0.38,'Upstream'],['Gasoline',63000,0.12,'Energy Products'],['Diesel',48000,0.14,'Energy Products'],
    ['Jet Fuel',22000,0.16,'Energy Products'],['Polyethylene',19000,0.22,'Chemical Products'],['Aromatics',12000,0.19,'Chemical Products'],
    ['Lubricants',9000,0.41,'Specialty Products'],['Basestocks',6000,0.37,'Specialty Products']];
    return d.map(function(r){return {label:r[0],value:r[1]*1e6,glow:r[2],group:r[3]};});
  }
  var st={cfg:{},data:null,unsub:null};
  function recompute(){var c=st.cfg||{};
    if(st.data&&c.value&&st.data[c.value]){
      var val=st.data[c.value]||[],lab=(c.label&&st.data[c.label])||[],gl=(c.glow&&st.data[c.glow])||[],gr=(c.group&&st.data[c.group])||[];
      var mx=Math.max.apply(null,gl.map(Number).concat([1]));
      var chips=val.map(function(v,i){var g=Number(gl[i]);if(g>1.5)g=g/(mx||1);return {label:lab[i]!=null?String(lab[i]):('Chiplet '+i),value:Number(v)||0,glow:isNaN(g)?0.5:Math.max(0,Math.min(1,g)),group:gr[i]!=null?String(gr[i]):''};});
      if(chips.length){render(chips);return;}
    }
    render(synth());
  }
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(recompute,120);});
  if(client){client.config.subscribe(function(cfg){st.cfg=cfg||{};
    if(st.unsub){st.unsub();st.unsub=null;}
    if(cfg&&cfg.source){st.unsub=client.elements.subscribeToElementData(cfg.source,function(d){st.data=d;recompute();});}
    recompute();});
  }else{recompute();}
})();
</script>
</body>
</html>
